<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Métricas de uso — Humanizar</title>
<style>
  :root { --bg:#0a0d12; --card:#121722; --line:#1f2634; --tx:#e7edf5; --mut:#8b98ab; --ac:#4fd1c5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:1040px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  h2 { font-size:16px; margin:32px 0 12px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  p.sub { color:var(--mut); margin:0 0 24px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:24px; }
  input, select, button { background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:inherit; }
  button { cursor:pointer; border-color:var(--ac); color:var(--ac); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  .c { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .c .site { color:var(--ac); font-weight:600; margin-bottom:10px; word-break:break-all; }
  .kv { display:flex; justify-content:space-between; padding:3px 0; }
  .kv span:last-child { font-variant-numeric:tabular-nums; font-weight:600; }
  .mut { color:var(--mut); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:9px 14px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--mut); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  #aviso { background:#2a1416; border:1px solid #5b2126; color:#ffb4ac; padding:12px 14px; border-radius:10px; margin-bottom:20px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Métricas de uso</h1>
  <p class="sub">humanizar.tech · catalogo.humanizar.tech · agenda.humanizar.tech</p>

  <div id="aviso" hidden></div>

  <div class="bar">
    <input id="token" type="password" placeholder="Token del panel" autocomplete="off" size="28">
    <select id="dias">
      <option value="1">Hoy</option>
      <option value="7">7 días</option>
      <option value="30" selected>30 días</option>
      <option value="90">90 días</option>
    </select>
    <button id="cargar" type="button">Cargar</button>
  </div>

  <div id="contenido" hidden>
    <h2>Resumen por sitio</h2>
    <div class="cards" id="resumen"></div>

    <h2>Clicks por tarjeta</h2>
    <table id="tarjetas"><thead><tr><th>Sitio</th><th>Tarjeta / CTA</th><th class="n">Clicks</th></tr></thead><tbody></tbody></table>

    <h2>Envíos de formulario</h2>
    <table id="formularios"><thead><tr><th>Sitio</th><th>Producto / formulario</th><th class="n">Envíos</th></tr></thead><tbody></tbody></table>

    <h2>Por día</h2>
    <table id="pordia"><thead><tr><th>Día</th><th class="n">Vistas</th><th class="n">Clicks</th><th class="n">Envíos</th></tr></thead><tbody></tbody></table>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var aviso = $("aviso");

  var enUrl = new URLSearchParams(location.search).get("token");
  if (enUrl) $("token").value = enUrl;

  function fallo(msg) {
    aviso.textContent = msg;
    aviso.hidden = false;
    $("contenido").hidden = true;
  }

  function texto(v) {
    var n = document.createTextNode(v == null ? "—" : String(v));
    return n;
  }

  function pintarTabla(id, filas, columnas) {
    var tbody = $(id).querySelector("tbody");
    tbody.textContent = "";
    if (!filas.length) {
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = columnas.length;
      td.className = "mut";
      td.appendChild(texto("Sin datos todavía."));
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }
    filas.forEach(function (f) {
      var tr = document.createElement("tr");
      columnas.forEach(function (col) {
        var td = document.createElement("td");
        if (col.n) td.className = "n";
        td.appendChild(texto(f[col.k]));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function pintarResumen(filas) {
    var cont = $("resumen");
    cont.textContent = "";
    if (!filas.length) {
      var vacio = document.createElement("p");
      vacio.className = "mut";
      vacio.appendChild(texto("Todavía no llegó ningún evento."));
      cont.appendChild(vacio);
      return;
    }
    filas.forEach(function (f) {
      var c = document.createElement("div");
      c.className = "c";
      var t = document.createElement("div");
      t.className = "site";
      t.appendChild(texto(f.site));
      c.appendChild(t);
      [
        ["Vistas de página", f.pageviews],
        ["Sesiones", f.sesiones],
        ["Clicks en tarjeta", f.clicks],
        ["Envíos de formulario", f.envios],
        ["Tiempo medio", f.seg_promedio == null ? "—" : f.seg_promedio + " s"],
      ].forEach(function (par) {
        var fila = document.createElement("div");
        fila.className = "kv";
        var a = document.createElement("span");
        a.className = "mut";
        a.appendChild(texto(par[0]));
        var b = document.createElement("span");
        b.appendChild(texto(par[1]));
        fila.appendChild(a);
        fila.appendChild(b);
        c.appendChild(fila);
      });
      cont.appendChild(c);
    });
  }

  async function cargar() {
    var token = $("token").value.trim();
    if (!token) return fallo("Escribí el token del panel.");
    aviso.hidden = true;
    try {
      var res = await fetch("/api/stats?dias=" + encodeURIComponent($("dias").value), {
        headers: { "X-Panel-Token": token },
      });
      var json = await res.json().catch(function () { return {}; });
      if (res.status === 401) return fallo("Token inválido.");
      if (json.error === "sin_DATABASE_URL") return fallo("Falta configurar DATABASE_URL en el proyecto de Vercel.");
      if (!res.ok || !json.ok) return fallo("No se pudieron leer las métricas.");

      pintarResumen(json.resumen);
      pintarTabla("tarjetas", json.tarjetas, [{ k: "site" }, { k: "label" }, { k: "clicks", n: true }]);
      pintarTabla("formularios", json.formularios, [{ k: "site" }, { k: "label" }, { k: "envios", n: true }]);
      pintarTabla("pordia", json.por_dia, [{ k: "dia" }, { k: "pageviews", n: true }, { k: "clicks", n: true }, { k: "envios", n: true }]);
      $("contenido").hidden = false;
    } catch (e) {
      fallo("Sin red o el servidor no responde.");
    }
  }

  $("cargar").addEventListener("click", cargar);
  $("token").addEventListener("keydown", function (e) { if (e.key === "Enter") cargar(); });
  if (enUrl) cargar();
})();
</script>
</body>
</html>
