<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo Mouseîon — Humanizar</title>
<meta name="description" content="Catálogo de productos del ecosistema Mouseîon, con estado medido en vivo.">
<meta name="theme-color" content="#0B1020">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Catálogo Mouseîon">
<meta property="og:description" content="Productos del ecosistema Mouseîon y su estado.">
<meta property="og:type" content="website">
<style>
  :root{
    --ink:#0B1020; --on-ink:#EEF2FA; --on-ink-mute:#A9B6D2; --on-ink-dim:#8494B6;
    --marigold:#FFB020; --ok:#5FD39B; --alert:#FF8A6B; --hairline:#2A3654;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--on-ink);
       font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .h-l{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:0 0 8px}
  .h-m{font-size:17px;line-height:1.3;margin:0}
  .kicker{color:var(--on-ink-mute);font-size:13px;letter-spacing:.04em;margin:0 0 20px}
  .lede{color:var(--on-ink-mute)}
  .sec-head{padding:48px 0 8px}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 8px;
       border:1px solid var(--hairline);border-radius:999px;color:var(--on-ink-mute)}
  .cat-grid{display:grid;gap:18px;padding-bottom:56px;
            grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card.cat-card{border:1px solid var(--hairline);border-radius:14px;overflow:hidden;
       background:rgba(255,255,255,.02);display:flex;flex-direction:column}
  .cat-img{width:100%;aspect-ratio:1200/630;object-fit:cover;display:block;
           border-bottom:1px solid var(--hairline);background:#060912}
  .cat-img-vacia{display:grid;place-items:center;color:rgba(255,255,255,.62);
                 font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .cat-cuerpo{padding:14px 16px 16px;display:grid;gap:8px}
  .cat-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .cat-url{color:var(--on-ink-dim);font-size:13px;text-decoration:none;word-break:break-all}
  .cat-url:hover{color:var(--marigold);text-decoration:underline}
  .cat-url-off{font-style:italic}
  .cat-meta{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 0}
  .cat-swatch i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .cat-estado{white-space:nowrap;flex:none}
  @media (prefers-reduced-motion:no-preference){
    .card.cat-card{transition:transform .18s ease}
    .card.cat-card:hover{transform:translateY(-2px)}
  }
</style>
</head>
<body>
  <header class="site-nav" style="padding:18px 0;border-bottom:1px solid var(--hairline);margin-bottom:8px">
    <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <a href="/" style="color:var(--on-ink);text-decoration:none;font-weight:600">Catálogo Mouseîon</a>
      <nav style="display:flex;gap:14px;flex-wrap:wrap">
        <a href="https://agenda.humanizar.tech/?producto=Catalogo" rel="noopener" style="color:var(--marigold);text-decoration:none">Reservar 30 min</a>
        <a href="/cauce-v3.html" rel="noopener" style="color:var(--on-ink-mute);text-decoration:none">Cauce V3 →</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="sec-head">
      <h1 class="h-l">Catálogo Mouseîon</h1>
      <p class="kicker">Estado medido en vivo. El borde de cada tarjeta usa el theme-color del producto.</p>
    </div>
    <section id="catalogo-mouseion" aria-live="polite">
      <p class="lede">Cargando catálogo…</p>
    </section>
  </main>
  <script type="module" src="catalogo.mjs"></script>
  <!-- Recarga en desarrollo: sólo se activa en localhost, nunca en producción. -->
  <script type="module" src="catalogo-dev-sync.mjs"></script>
</body>
</html>
